services:
  loouwd-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loouwd_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/sources"]
      interval: 30s
      timeout: 5s
      retries: 3
